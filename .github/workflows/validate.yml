name: Validate PackOps
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Test
        run: npm test
      - name: Build and verify files
        run: |
          npm run build
          test -f dist/finance-ui.js
          test -f dist/calendar-api.js
          test -f dist/backup.js
          test -f dist/settings-actions.js
          test -f dist/cloud-config-validation.js
      - name: Verify configured production build
        run: |
          node --input-type=module -e "import {PACK_CLOUD_CONFIG as c} from './cloud-config.js'; import {hasCloudConfiguration as has} from './cloud-config-validation.js'; import {execFileSync} from 'node:child_process'; if(has(c)) execFileSync(process.execPath,['tools/build.mjs','--require-cloud'],{stdio:'inherit'}); else console.log('::warning::Public Pack configuration is blank. Do not release automatic sign-in until supplied and build:production passes.');"
